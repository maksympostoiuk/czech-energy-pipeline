[project]
name = "energy-pipeline"
version = "0.1.0"
description = "Daily ETL for the Czech electricity market: OTE day-ahead prices, ČNB FX rates and ČHMÚ weather into DuckDB, modelled with dbt."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6,<1.6",
    "httpx>=0.28.1",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.6",
    "pytz>=2026.5",
    "tenacity>=9.2.1",
    "tzdata>=2026.5",
]

[project.scripts]
pipeline = "energy_pipeline.cli:main"

[dependency-groups]
dashboard = [
    "streamlit>=1.66.1",
]
dbt = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.0",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev", "dbt", "dashboard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "DTZ",     # naive datetimes: important with CET/CEST data
    "PTH",     # pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# User-facing text uses real typography (en dash for ranges, minus sign).
"dashboard/**" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that call real external APIs (deselect with -m 'not integration')",
]
