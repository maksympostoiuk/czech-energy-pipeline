name: dbt docs

on:
  push:
    branches: [main]
    paths: ["dbt/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DBT_TARGET: prod
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - name: Check that the MotherDuck token is configured
        run: |
          if [ -z "$MOTHERDUCK_TOKEN" ]; then
            echo "::error::Repository secret MOTHERDUCK_TOKEN is missing (see README, Production)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The catalog (column types, row counts) is read from the production warehouse.
      - name: Generate dbt docs as a single static page
        working-directory: dbt
        run: |
          uv run dbt deps
          uv run dbt docs generate --static
          mkdir -p ../site
          cp target/static_index.html ../site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
