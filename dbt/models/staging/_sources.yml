version: 2

sources:
  - name: raw
    description: >
      Written only by the Python loader (src/energy_pipeline/load/warehouse.py): validated
      source rows plus _run_id and _ingested_at. Loads are idempotent upserts on the natural
      keys, so these tables never hold duplicates by design (tested in staging).
    schema: raw
    config:
      # The daily run loads every source every day (ČNB too: on weekends it re-loads the
      # last fixing), so a load older than a day means the schedule is broken.
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: ote_dam_results
        description: OTE day-ahead market results for the CZ bidding zone, one row per MTU period.
      - name: cnb_fx_rates
        description: ČNB exchange rate fixing, all currencies, business days only.
      - name: chmi_observations
        description: ČHMÚ 10-minute observations of the selected stations and elements, long format.
      - name: chmi_stations
        description: Snapshot of ČHMÚ station metadata (meta1), all stations.
        config:
          freshness: null
      - name: openmeteo_forecasts
        description: >
          Open-Meteo Previous Runs forecasts (DWD ICON-EU): per point and valid hour, the values
          predicted one and two days before, with issued_at, the latest possible run time.

  - name: ops
    schema: ops
    tables:
      - name: pipeline_runs
        description: One row per extract + load task, written by the pipeline CLI.
      - name: dbt_results
        description: dbt test, model and source freshness results, recorded after every scheduled run.

  - name: ml
    description: Written by the Python forecast job (`forecast predict`, `forecast backfill-history`).
    schema: ml
    tables:
      - name: price_forecast
        description: >
          Day-ahead price forecasts, one row per delivery hour, model and run type: 'live' rows
          are issued every morning before the auction, 'backtest' rows are walk-forward
          forecasts of the same models for the history.
        config:
          # The forecast job runs every morning; a day without a new forecast is an incident.
          loaded_at_field: _ingested_at
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
