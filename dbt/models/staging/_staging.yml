version: 2

models:
  - name: stg_ote__dam_prices
    description: >
      OTE day-ahead market results with clock times. One row per market time unit (MTU):
      60 minutes up to 2025-09-30, 15 minutes from 2025-10-01.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [delivery_date, period]
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: interval_end_utc
            column_B: interval_start_utc
    columns:
      - name: delivery_date
        description: Delivery day in Europe/Prague.
        data_tests:
          - not_null
          - dbt_expectations.expect_row_values_to_have_recent_data:
              arguments:
                datepart: day
                interval: 1
              config:
                tags: [freshness]
      - name: period
        description: 1-based MTU index within the delivery day (local time).
        data_tests: [not_null]
      - name: mtu_minutes
        description: Length of the market time unit, 60 or 15.
        data_tests:
          - accepted_values:
              arguments:
                values: [15, 60]
      - name: interval_start_utc
        description: Start of the MTU, derived from local midnight so DST days are correct.
        data_tests: [unique, not_null]
      - name: interval_end_utc
      - name: interval_start_local
        description: Start of the MTU as Prague wall-clock time (repeats on the autumn DST day).
      - name: price_eur_mwh
        description: Clearing price in EUR/MWh (15-minute price from 2025-10-01).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ var('sdac_min_price_eur_mwh') }}"
                max_value: "{{ var('sdac_max_price_eur_mwh') }}"
      - name: price_60min_ref_eur_mwh
        description: OTE's hourly reference price, repeated on each quarter; null before 2025-10-01.
      - name: volume_mwh
        description: Traded volume in MWh per MTU (not per hour).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: ingested_at

  - name: stg_cnb__fx_rates
    description: ČNB fixing, all currencies, business days only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [valid_for, currency_code]
    columns:
      - name: valid_for
        description: Day the fixing is valid for (also returned for later non-business days by the API).
        data_tests:
          - not_null
          - dbt_expectations.expect_row_values_to_have_recent_data:
              arguments:
                datepart: day
                interval: 5  # Christmas and Easter leave up to 4 days without a fixing
              config:
                tags: [freshness]
      - name: currency_code
        data_tests: [not_null]
      - name: amount
        description: Number of currency units the published rate refers to (1, 100 or 1000).
      - name: rate_per_amount_czk
        description: Rate as published, CZK per `amount` units.
      - name: rate_czk
        description: CZK per 1 unit of the currency.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
          - dbt_expectations.expect_column_values_to_be_between:
              name: eur_czk_within_plausible_band
              arguments:
                min_value: 20
                max_value: 30
                row_condition: "currency_code = 'EUR'"
      - name: ingested_at

  - name: stg_chmi__observations
    description: ČHMÚ 10-minute observations in long format with readable measure names.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, chmi_element, observed_at_utc]
    columns:
      - name: station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('chmi_stations_selected')
                field: station_id
      - name: measure
        description: Readable name with unit, e.g. temperature_c or global_radiation_wm2.
        data_tests: [not_null]
      - name: chmi_element
        description: Original ČHMÚ element code (T, F, RGLB10, SSV10M, SRA10M, H).
      - name: observed_at_utc
        data_tests:
          - not_null
          - dbt_expectations.expect_row_values_to_have_recent_data:
              arguments:
                datepart: hour
                interval: 30
              config:
                tags: [freshness]
                severity: warn
      - name: value
        description: Measured value; null when ČHMÚ marks it missing.
      - name: quality
        description: ČHMÚ quality code (0 good, 1 suspect, 2 poor, 3 estimated, 4 missing, 5 not checked).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
      - name: is_plausible
        description: Value within the physical range of seed chmi_measure_ranges.
      - name: is_usable
        description: Value present, quality in var('chmi_usable_quality') and physically plausible.
      - name: source_folder
        description: historical (archive CSV), recent (quality-checked) or now (fresh, unchecked).
      - name: ingested_at

  - name: stg_chmi__stations
    description: Latest ČHMÚ station metadata, one row per station.
    columns:
      - name: station_id
        data_tests: [unique, not_null]

  - name: stg_ops__pipeline_runs
    description: Extract + load task log with durations, for monitoring.
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [success, no_data, failed]

  - name: stg_ops__dbt_results
    description: Results of every recorded dbt invocation, for the Data Quality dashboard page.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [invocation_id, unique_id]

  - name: stg_openmeteo__forecasts
    description: >
      Open-Meteo weather forecasts as issued (DWD ICON-EU via the Previous Runs API), one row
      per point, valid hour and lead. Only runs no later than issued_at_utc contributed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [point_id, model, valid_at_utc, lead_days]
      - dbt_utils.expression_is_true:
          name: openmeteo_issued_at_is_the_run_lead_days_before
          arguments:
            expression: >
              issued_at_utc = time_bucket(interval 6 hour, valid_at_utc - to_days(lead_days))
    columns:
      - name: point_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('openmeteo_points')
                field: point_id
      - name: model
        description: Open-Meteo model name.
        data_tests:
          - accepted_values:
              arguments:
                values: [dwd_icon_eu]
      - name: valid_at_utc
        description: Hour the forecast is for (instantaneous values at that time).
        data_tests:
          - not_null
          - dbt_expectations.expect_row_values_to_have_recent_data:
              arguments:
                datepart: day
                interval: 1
              config:
                tags: [freshness]
      - name: lead_days
        description: The value was predicted this many days before valid_at_utc.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
      - name: issued_at_utc
        description: Latest possible initialisation of the run behind the values, floor_6h(valid_at_utc - lead_days).
        data_tests: [not_null]
      - name: radiation_hour_start_utc
        description: Start of the hour shortwave_radiation_wm2 is the mean of (valid_at_utc - 1 h).
      - name: temperature_2m_c
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -50
                max_value: 50
      - name: shortwave_radiation_wm2
        description: Global horizontal irradiance, mean over the hour before valid_at_utc.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1361  # solar constant
      - name: wind_speed_10m_ms
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 75
      - name: wind_speed_100m_ms
        description: Wind speed at 100 m, close to wind turbine hub height.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: cloud_cover_pct
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: ingested_at
