name: czech_energy
version: "1.0.0"
config-version: 2
profile: czech_energy

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # ČHMÚ quality codes kept for analysis: 0 good, 1 suspect, 3 estimated,
  # 5 not checked yet. 2 (poor) and 4 (missing) are dropped. See docs/sources.md.
  chmi_usable_quality: [0, 1, 3, 5]
  # OTE peak load is 08:00-20:00 local time on every day, as in its daily report.
  peak_start_hour: 8
  peak_end_hour: 20
  # SDAC harmonised minimum / maximum clearing price. The maximum can be raised
  # automatically after price spikes, so it lives here and not inside tests.
  sdac_min_price_eur_mwh: -500
  sdac_max_price_eur_mwh: 4000
  # Used by dbt_date / dbt_expectations for "now" in recency tests.
  "dbt_date:time_zone": Europe/Prague
  # The price forecast for delivery day D+1 is made on D before the day-ahead auction
  # closes at 12:00 Prague time; every feature must be known by then.
  forecast_cutoff_hour_local: 12
  # A weather model run is assumed published this long after its initialisation time.
  # ICON-EU is served ~3 h after (docs/sources.md, section 5); 6 h keeps a margin and
  # leaves the 00Z run of D as the latest one used, in summer and in winter.
  openmeteo_publication_delay_hours: 6
  # First delivery day with every feature: the forecast archive has both leads for every
  # hour from 2024-01-21, and a week of price history exists by then.
  ml_first_delivery_date: "2024-01-22"

models:
  czech_energy:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    ml:
      +schema: ml
      +materialized: table

seeds:
  czech_energy:
    +schema: reference
